name: Build apps and release
# Temporary branch workflow: verifies the APK signed with the owner's release key outside CI,
# confirms it is the CI-built v0.2.0 APK, install-tests it, then publishes the v0.2.0 release.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-signed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.2.0
      APK: signed/Shiftwise-0.2.0-android.apk
      CERT: 0D:20:36:8B:51:9B:28:5C:87:47:D7:01:A2:8B:F8:A6:46:88:0D:A8:C3:57:B2:FA:B4:D6:0C:CE:0A:DB:4F:60
    steps:
      - uses: actions/checkout@v5
      - name: Verify signature, certificate, alignment and package
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' verify.txt | awk '{print $NF}' | tr a-f A-F | sed 's/../&:/g; s/:$//')
          echo "cert $GOT"; [ "$GOT" = "$CERT" ]
          "$BT/zipalign" -c -p 4 "$APK"
          "$BT/aapt2" dump badging "$APK" | head -3 | tee badging.txt
          grep -q "versionName='0.2.0'" badging.txt
      - name: Confirm it is the CI-built APK (same entries and CRCs as the draft's unsigned APK)
        run: |
          set -euo pipefail
          mkdir -p u && gh release download "$TAG" --pattern 'Shiftwise-*-android-unsigned.apk' --dir u
          unzip -lv u/*.apk | awk 'NF>=8 && $7 ~ /^[0-9a-f]{8}$/ {print $7, $8}' | sort > a.txt
          unzip -lv "$APK" | awk 'NF>=8 && $7 ~ /^[0-9a-f]{8}$/ {print $7, $8}' | sort > b.txt
          wc -l a.txt b.txt; diff a.txt b.txt
          cp "$APK" smoke-test.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install and launch the signed APK on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash apps/android-smoke.sh smoke-test.apk android-smoke || { grep -q 'in dying proc com.google.android.gms' android-smoke/logcat.txt && echo 'Emulator Play services crashed and took the app down; retrying once' && sleep 30 && rm -rf android-smoke && bash apps/android-smoke.sh smoke-test.apk android-smoke; }
      - uses: actions/upload-artifact@v5
        if: always()
        with: {name: signed-smoke, path: android-smoke, retention-days: 7}
      - name: Publish the release with the signed APK
        run: |
          set -euo pipefail
          mkdir -p sums && cd sums
          gh release download "$TAG" --pattern 'SHA256SUMS.txt'
          grep -v android-unsigned SHA256SUMS.txt > s.tmp
          (cd .. && sha256sum "./signed/Shiftwise-0.2.0-android.apk" | sed 's#./signed/#./#') >> s.tmp
          mv s.tmp SHA256SUMS.txt && cat SHA256SUMS.txt
          cd ..
          gh release delete-asset "$TAG" Shiftwise-0.2.0-android-unsigned.apk --yes
          gh release upload "$TAG" "$APK" sums/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest
          gh release delete preview-apps-v0.2.0 --yes || true
          gh release view "$TAG" --json isDraft,assets --jq '{draft: .isDraft, assets: [.assets[].name]}'
